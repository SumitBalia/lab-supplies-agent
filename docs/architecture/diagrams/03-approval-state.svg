<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="715" viewBox="0 0 1400 715"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#2f6b9a"/></marker></defs><rect width="1400" height="715" fill="#f7fbfe"/><rect width="1400" height="65" fill="#082a4a"/><text x="30" y="43" fill="#ffffff" font-family="Helvetica Neue,Arial,sans-serif" font-size="28" text-anchor="start" font-weight="700">Approval state and recovery of an unconfirmed write</text><rect x="30" y="130" width="300" height="110" rx="7" fill="#ffffff" stroke="#2f6b9a" stroke-width="2"/><text x="48" y="167" fill="#082a4a" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700">Validated proposal</text><text x="48" y="202" fill="#304355" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">Read stock + catalogue</text><rect x="550" y="130" width="300" height="110" rx="7" fill="#e6f0f8" stroke="#2f6b9a" stroke-width="2"/><text x="568" y="167" fill="#082a4a" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700">pending</text><text x="568" y="202" fill="#304355" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">Saved before reply</text><rect x="1010" y="350" width="330" height="130" rx="7" fill="#e6f0f8" stroke="#2f6b9a" stroke-width="2"/><text x="1028" y="387" fill="#082a4a" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700">approved</text><text x="1028" y="422" fill="#304355" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">Saved before write</text><text x="1028" y="451" fill="#304355" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">Signed proof is internal</text><rect x="550" y="570" width="300" height="105" rx="7" fill="#e6f0f8" stroke="#2f6b9a" stroke-width="2"/><text x="568" y="607" fill="#082a4a" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700">completed</text><text x="568" y="642" fill="#304355" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">Receipt confirmed</text><rect x="30" y="350" width="330" height="130" rx="7" fill="#ffffff" stroke="#2f6b9a" stroke-width="2"/><text x="48" y="387" fill="#082a4a" font-family="Helvetica Neue,Arial,sans-serif" font-size="26" text-anchor="start" font-weight="700">declined</text><text x="48" y="422" fill="#304355" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">No order from this path</text><text x="48" y="451" fill="#304355" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">Also used for expiry</text><path d="M330 185 H550" fill="none" stroke="#2f6b9a" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="440" y="170" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="23" text-anchor="middle" font-weight="400">save</text><path d="M550 210 H400 V315 H195 V350" fill="none" stroke="#2f6b9a" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="225" y="300" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="21" text-anchor="middle" font-weight="400">decline or &gt;24h pending</text><path d="M850 185 H1175 V350" fill="none" stroke="#2f6b9a" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1110" y="170" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="400">explicit approval</text><text x="550" y="280" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">Pending survives service restart</text><path d="M1175 480 V622 H850" fill="none" stroke="#2f6b9a" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1100" y="555" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="400">receipt confirmed</text><path d="M1340 415 H1375 V285 H1175 V350" fill="none" stroke="#2f6b9a" stroke-width="2.5"  marker-end="url(#arrow)"/><text x="1145" y="268" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="middle" font-weight="400">retry same proposal ID</text><text x="30" y="548" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">On a lost response the mock may already have</text><text x="30" y="580" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">committed the order. Approval stays approved.</text><text x="30" y="612" fill="#5b7085" font-family="Helvetica Neue,Arial,sans-serif" font-size="22" text-anchor="start" font-weight="400">A UNIQUE key returns the original receipt.</text></svg>